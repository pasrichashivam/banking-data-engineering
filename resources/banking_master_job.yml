# =============================================================================
# banking_master_job  (Parent Job — orchestrates the full banking data pipeline)
# =============================================================================
# This job is the top-level orchestrator. It cascades through three layers
# (bronze → silver → ods) by calling the child job `banking_source_to_target`
# with a different `target_layer` parameter each time. After ODS is complete,
# it fans out to DWH, reporting, and analysis notebooks.
#
# Hierarchy:
#   banking_master_job
#     ├── bronze_layer   → run_job(banking_source_to_target, target_layer=bronze)
#     ├── silver_layer    → run_job(banking_source_to_target, target_layer=silver)
#     ├── ods_layer       → run_job(banking_source_to_target, target_layer=ods)
#     ├── dwh_layer       → notebook(01_dwh_tables)
#     ├── analysis_360_layer → notebook(04_analysis_360_degree)
#     ├── reporting_layer → notebook(03_reporting_tables)
#     └── ods_report_layer → notebook(03_ods_reports)
# =============================================================================

resources:
  jobs:
    banking_master_job:
      name: banking_master_job

      # ── Job-level parameters ──
      parameters:
        - name: environment
          default: ${var.environment}
        - name: force_reload
          default: ${var.force_reload}
        - name: processing_date
          default: ${var.processing_date}

      # ── Job settings ──
      max_concurrent_runs: 1
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED

      # ── Tasks (sequential cascade: bronze → silver → ods → fan-out) ──
      tasks:
        # --- Layer 1: Bronze ---
        - task_key: bronze_layer
          run_job_task:
            job_id: ${resources.jobs.banking_source_to_target.id}
            job_parameters:
              target_layer: bronze
          # Passes top-level params down to the child job
          # environment, force_reload, processing_date are inherited from job parameters

        # --- Layer 2: Silver (depends on Bronze) ---
        - task_key: silver_layer
          depends_on:
            - task_key: bronze_layer
          run_job_task:
            job_id: ${resources.jobs.banking_source_to_target.id}
            job_parameters:
              target_layer: silver

        # --- Layer 3: ODS (depends on Silver) ---
        - task_key: ods_layer
          depends_on:
            - task_key: silver_layer
          run_job_task:
            job_id: ${resources.jobs.banking_source_to_target.id}
            job_parameters:
              target_layer: ods

        # --- Layer 4: DWH tables (depends on ODS) ---
        - task_key: dwh_layer
          depends_on:
            - task_key: ods_layer
          notebook_task:
            notebook_path: ../src/04_dwh_layer/01_dwh_tables.ipynb

        # --- Layer 5a: 360-degree analysis (depends on DWH) ---
        - task_key: analysis_360_layer
          depends_on:
            - task_key: dwh_layer
          notebook_task:
            notebook_path: ../src/04_dwh_layer/04_analysis_360_degree.ipynb

        # --- Layer 5b: Reporting tables (depends on DWH) ---
        - task_key: reporting_layer
          depends_on:
            - task_key: dwh_layer
          notebook_task:
            notebook_path: ../src/04_dwh_layer/03_reporting_tables.ipynb

        # --- Layer 5c: ODS reports (depends on ODS) ---
        - task_key: ods_report_layer
          depends_on:
            - task_key: ods_layer
          notebook_task:
            notebook_path: ../src/03_ods_layer/03_ods_reports.ipynb
